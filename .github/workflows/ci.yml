name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check relayx benchmarks tests

      - name: Check formatting with black
        run: black --check relayx benchmarks tests

      - name: Check import ordering with isort
        run: isort --check-only relayx benchmarks tests

      - name: Type check with mypy
        run: mypy relayx benchmarks tests

      - name: Compile Python files
        run: python -m compileall relayx benchmarks tests

      - name: Run unit tests with coverage
        run: pytest tests/unit --cov=relayx --cov=benchmarks --cov-report=xml:coverage.xml --cov-report=html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run integration tests
        run: pytest tests/integration

  benchmark-validation:
    name: Benchmark validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run benchmark validation tests
        run: pytest tests/benchmark_validation

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run bandit
        run: bandit -r relayx benchmarks tests

      - name: Run pip-audit
        run: pip-audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t relayx:ci .
