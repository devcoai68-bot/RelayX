name: Bug report
description: Report a reproducible RelayX defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands, configuration with secrets redacted, and expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RelayX version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version if applicable, and deployment mode.
