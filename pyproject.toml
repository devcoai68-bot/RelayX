[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relayx"
version = "1.0.0"
description = "Message-oriented encrypted HTTP relay over HTTP/1.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "RelayX Maintainers" }]
keywords = ["http", "relay", "encryption", "chacha20-poly1305", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42,<50",
  "msgpack>=1.0,<2.0",
  "zstandard>=0.22,<1.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/devcoai68-bot/RelayX"
Repository = "https://github.com/devcoai68-bot/RelayX"
Issues = "https://github.com/devcoai68-bot/RelayX/issues"
Changelog = "https://github.com/devcoai68-bot/RelayX/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2.0",
  "black>=24,<27",
  "build>=1.2,<2.0",
  "isort>=5,<9",
  "mypy>=1.10,<3.0",
  "pip-audit>=2.7,<3.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1.0",
  "twine>=5,<7",
]

[project.scripts]
relayx = "relayx.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "asyncio: mark tests that require pytest-asyncio",
]


[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 312
known_first_party = ["relayx", "benchmarks", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["relayx", "benchmarks", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E731", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
packages = ["relayx", "benchmarks", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment", "call-arg", "union-attr", "var-annotated"]

[tool.coverage.run]
branch = true
source = ["relayx", "benchmarks"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = [".venv", "htmlcov", "tests"]

[tool.setuptools.packages.find]
include = ["relayx*"]
exclude = ["benchmarks*", "tests*"]

