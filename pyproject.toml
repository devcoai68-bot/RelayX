[project]
name = "relayx"
version = "1.0.0"
description = "Message-oriented encrypted HTTP relay over HTTP/1.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42,<50",
  "msgpack>=1.0,<2.0",
  "zstandard>=0.22,<1.0",
  "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2.0",
  "black>=24,<27",
  "isort>=5,<9",
  "mypy>=1.10,<2.0",
  "pip-audit>=2.7,<3.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1.0",
]

[project.scripts]
relayx = "relayx.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]


[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 312
known_first_party = ["relayx", "benchmarks", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["relayx", "benchmarks", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E731", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
packages = ["relayx", "benchmarks", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment", "call-arg", "union-attr", "var-annotated"]

[tool.coverage.run]
branch = true
source = ["relayx", "benchmarks"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = [".venv", "htmlcov"]
